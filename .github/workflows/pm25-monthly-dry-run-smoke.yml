name: PM2.5 Monthly Dry-Run Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pm25-monthly-dry-run-smoke
  cancel-in-progress: false

jobs:
  retrain-evaluate-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRAINING_ALLOWED_SOURCES: open-meteo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - run: python -m pip install --requirement training/requirements.txt

      - name: Validate server-side secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1;
          }

      - name: Restore read-only Open-Meteo archive cache
        uses: actions/cache@v4
        with:
          path: training/.cache/open-meteo-monthly
          key: pm25-open-meteo-archive-v1-2022-08-01-to-db-boundary

      - name: Fresh train and compare without Production writes
        shell: bash
        run: |
          set -euo pipefail
          python -u -m training.monthly_auto_retrain \
            --dry-run \
            --artifact-dir training/artifacts \
            --archive-cache-dir training/.cache/open-meteo-monthly \
            | tee monthly-retrain.log

      - name: Upload dry-run audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm25-monthly-dry-run-${{ github.run_id }}
          path: |
            training/artifacts/
            monthly-retrain.log
          if-no-files-found: warn
          retention-days: 14

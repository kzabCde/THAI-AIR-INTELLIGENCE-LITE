name: Training Archive Backfill

on:
  push:
    branches:
      - main
    paths:
      - training/backfill_training_archive.py
      - training/db_training_data.py
      - supabase/migrations/20260906170000_training_archive_db_only.sql
      - .github/workflows/training-archive-backfill.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and validate without writing Supabase
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: training-archive-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - run: python -m pip install --requirement training/requirements.txt

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1;
          }

      - name: Persist 2022-08-01 through 2025-07-18 archive with lineage
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --start-date 2022-08-01
            --end-date 2025-07-18
            --chunk-days 365
            --province-batch-size 5
          )
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -u training/backfill_training_archive.py "${args[@]}" | tee training-archive-backfill.log

      - name: Write source-of-truth summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Historical PM2.5 training archive"
            echo
            echo "- Requested source period: \`2022-08-01 → 2025-07-18\`"
            echo "- First usable CAMS PM2.5 date returned by source: \`2022-08-05\`"
            echo "- Leading source gap: \`4 days\` (preserved; not synthesized/interpolated)"
            echo "- Destination: \`training_daily_archive_v1\`"
            echo "- Request lineage: \`training_archive_requests_v1\`"
            echo "- Air source/model: \`Open-Meteo / CAMS global\`"
            echo "- Weather source: \`Open-Meteo Historical Weather\`"
            echo "- Timezone: \`Asia/Bangkok\`"
            echo "- Expected source-available archive rows: \`21,580\` (1,079 days × 20 provinces)"
            echo "- Retraining network dependency after completion: \`none\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backfill audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-archive-backfill-${{ github.run_id }}
          path: training-archive-backfill.log
          if-no-files-found: warn
          retention-days: 14

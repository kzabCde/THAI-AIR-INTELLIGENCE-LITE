name: PM2.5 Dual-Model Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run training, register candidates, or generate forecasts only
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - register
          - forecast-only
      activate:
        description: Activate only eligible regression/classification candidates
        required: true
        default: false
        type: boolean
      run_forecast:
        description: Generate forecasts after a successful training/registration run
        required: true
        default: false
        type: boolean
      province:
        description: Province ID such as TH-30, or all
        required: true
        default: all
        type: string
      model_families:
        description: Comma-separated families (all six by default)
        required: true
        default: random_forest,adaboost,gradient_boosting,xgboost,lightgbm,catboost
        type: string
      minimum_rows:
        description: Minimum leakage-safe rows per province
        required: true
        default: "180"
        type: string
      horizon:
        description: Forecast horizon in days (1-14)
        required: true
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: pm25-dual-model-pipeline
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      should_train: ${{ steps.validate.outputs.should_train }}
      should_forecast: ${{ steps.validate.outputs.should_forecast }}
    steps:
      - id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.minimum_rows }}" =~ ^[0-9]+$ ]] || {
            echo "::error::minimum_rows must be an integer"; exit 1;
          }
          [[ "${{ inputs.horizon }}" =~ ^[0-9]+$ ]] || {
            echo "::error::horizon must be an integer"; exit 1;
          }
          (( ${{ inputs.horizon }} >= 1 && ${{ inputs.horizon }} <= 14 )) || {
            echo "::error::horizon must be between 1 and 14"; exit 1;
          }
          if [[ "${{ inputs.activate }}" == "true" && "${{ inputs.mode }}" != "register" ]]; then
            echo "::error::activate=true is allowed only with mode=register"
            exit 1
          fi
          if [[ "${{ inputs.province }}" != "all" && ! "${{ inputs.province }}" =~ ^TH-[0-9]{2}$ ]]; then
            echo "::error::province must be all or a TH-xx ID"
            exit 1
          fi
          if [[ "${{ inputs.mode }}" == "forecast-only" ]]; then
            echo "should_train=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_train=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ inputs.mode }}" == "forecast-only" || "${{ inputs.run_forecast }}" == "true" ]]; then
            echo "should_forecast=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_forecast=false" >> "$GITHUB_OUTPUT"
          fi

  train:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.should_train == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: python -m pip install --requirement training/requirements.txt
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1;
          }
      - name: Train and evaluate independent tasks
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ACTIVATE: ${{ inputs.activate }}
          PROVINCE: ${{ inputs.province }}
          MODEL_FAMILIES_INPUT: ${{ inputs.model_families }}
          MINIMUM_ROWS: ${{ inputs.minimum_rows }}
        run: |
          set -euo pipefail
          args=(--min-rows "$MINIMUM_ROWS")
          if [[ "$MODE" == "dry-run" ]]; then
            args+=(--dry-run)
          else
            args+=(--register)
          fi
          if [[ "$ACTIVATE" == "true" ]]; then
            args+=(--activate)
          fi
          if [[ "$PROVINCE" != "all" ]]; then
            args+=(--province "$PROVINCE")
          fi
          IFS=',' read -ra families <<< "$MODEL_FAMILIES_INPUT"
          for family in "${families[@]}"; do
            args+=(--model-family "$family")
          done
          python -u -m training.train_dual_models "${args[@]}"
      - name: Upload run summary and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm25-dual-model-${{ github.run_id }}
          path: training/artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Write training summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PM2.5 dual-model training"
            echo
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Activate: \`${{ inputs.activate }}\`"
            echo "- Province: \`${{ inputs.province }}\`"
            echo "- Families: \`${{ inputs.model_families }}\`"
            echo "- Minimum rows: \`${{ inputs.minimum_rows }}\`"
            echo "- Threshold version: \`thai-pm25-5class-v1\`"
            echo "- Classification selection metric: \`Macro F1\`"
          } >> "$GITHUB_STEP_SUMMARY"

  forecast:
    needs: [validate-inputs, train]
    if: >-
      always() &&
      needs.validate-inputs.outputs.should_forecast == 'true' &&
      (needs.train.result == 'success' || needs.train.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ML_FORECAST_URL: ${{ secrets.ML_FORECAST_URL }}
      ML_SECRET: ${{ secrets.ML_SECRET }}
    steps:
      - name: Validate forecast configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ML_FORECAST_URL" || { echo "::error::Missing ML_FORECAST_URL"; exit 1; }
          test -n "$ML_SECRET" || { echo "::error::Missing ML_SECRET"; exit 1; }
      - name: Generate forecasts from current active models
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $ML_SECRET" \
              --header "Content-Type: application/json" \
              --data '{"horizon":${{ inputs.horizon }}}' \
              "$ML_FORECAST_URL/api/ml/forecast"
          )"
          if [[ "$status" != "200" ]]; then
            echo "::error::Forecast endpoint returned HTTP $status"
            exit 1
          fi
          python -m json.tool "$response_file"

name: PM2.5 v5.6.4 Fresh DB-only Train

on:
  # This path-scoped trigger intentionally creates one post-merge training pass
  # when this reviewed one-shot workflow changes. Unrelated future pushes do
  # not retrigger it. Stability hardening v2 is the final corrective pass for
  # the provincial regression failures observed in run 34036394978.
  push:
    branches:
      - main
    paths:
      - .github/workflows/pm25-v5-6-4-fresh-train-once.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Train and compare without Production activation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pm25-v5-6-4-fresh-train
  cancel-in-progress: false

jobs:
  train-evaluate-safe-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      promoted: ${{ steps.result.outputs.promoted }}
      run_id: ${{ steps.result.outputs.run_id }}
      champion_run_id: ${{ steps.result.outputs.champion_run_id }}
      activation_status: ${{ steps.result.outputs.activation_status }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install reviewed training dependencies
        run: python -m pip install --requirement training/requirements.txt

      - name: Validate server-side training secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1;
          }

      - name: Train guarded v5.6.4 from latest Supabase data
        id: train
        shell: bash
        run: |
          set -euo pipefail
          args=(--artifact-dir training/artifacts)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -u -m training.train_models_pm25_v5_6_4 "${args[@]}" | tee pm25-v5-6-4-training.log

      - name: Read training decision
        id: result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("training/artifacts/monthly_promotion.json")
          payload = json.loads(path.read_text())
          print(f"promoted={'true' if payload.get('promoted') else 'false'}")
          print(f"run_id={payload['run_id']}")
          print(f"champion_run_id={payload['champion_run_id']}")
          print(f"activation_status={payload['activation_status']}")
          PY

      - name: Keep compact training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm25-v5-6-4-training-${{ github.run_id }}
          path: |
            training/artifacts/monthly_promotion.json
            training/artifacts/v5_6_4_regression_eligibility.csv
            training/artifacts/v5_6_4_regression_eligibility.json
            training/artifacts/v5_6_4_classification_focus.json
            training/artifacts/v5_6_4_chart_data.json
            training/artifacts/*/run_summary.json
            pm25-v5-6-4-training.log
          if-no-files-found: warn
          retention-days: 14

      - name: Training summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PM2.5 v5.6.4 guarded fresh training — stability v2"
            echo
            echo "- Source of truth: \`Supabase training_daily_summary_v3\` only."
            echo "- DB reader: bounded province/date windows with timeout retry; no global view sort."
            echo "- Open-Meteo/CAMS network archive reads during retraining: \`0\`."
            echo "- Active feature contract: \`daily-pooled-v1\` (hotspot/FRP remain gated)."
            echo "- Model pair: LightGBM regression + Random Forest classification."
            echo "- LightGBM selection: D+1 Validation gain + four-segment temporal stability + D+2–D+7 preservation."
            echo "- Random Forest selection: Classes 2–3 focus; Class 4–5 recall cannot decrease on CV/Validation."
            echo "- Per-province strict regression eligibility and stability evidence are retained as artifacts."
            echo "- Candidate run: \`${{ steps.result.outputs.run_id }}\`"
            echo "- Previous champion: \`${{ steps.result.outputs.champion_run_id }}\`"
            echo "- Promoted: \`${{ steps.result.outputs.promoted }}\`"
            echo "- Activation status: \`${{ steps.result.outputs.activation_status }}\`"
            echo "- Promotion uses the existing same-holdout safe atomic policy."
            echo "- This workflow does not force a forecast deployment; the normal forecast pipeline consumes any promoted active model."
          } >> "$GITHUB_STEP_SUMMARY"

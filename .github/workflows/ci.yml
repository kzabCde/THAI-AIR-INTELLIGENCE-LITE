name: CI

on:
  pull_request:
  push:
    branches: [main, codex/full-production-cleanup]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      CRON_SECRET: test-cron-secret
      ML_SECRET: test-ml-secret
      ML_FORECAST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: pip install -r requirements.txt
      - run: pip install -r training/requirements.txt
      - run: npm run pycompile
      - run: python -m pytest -q tests_py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m json.tool package.json >/dev/null
      - run: python -m json.tool package-lock.json >/dev/null

name: Activate PM2.5 Dual Models Once

on:
  push:
    branches:
      - ops/activate-dual-models-20260724
    paths:
      - .github/workflows/activate-dual-models-once.yml

permissions:
  contents: read

concurrency:
  group: activate-pm25-dual-models-production
  cancel-in-progress: false

jobs:
  train-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: python -m pip install --requirement training/requirements.txt
      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
      - name: Train, register, and activate eligible models
        shell: bash
        run: |
          set -euo pipefail
          python -u -m training.train_dual_models \
            --register \
            --activate \
            --min-rows 180 \
            --model-family random_forest \
            --model-family adaboost \
            --model-family gradient_boosting \
            --model-family xgboost \
            --model-family lightgbm \
            --model-family catboost
      - name: Upload run summary and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm25-dual-model-activation-${{ github.run_id }}
          path: training/artifacts/
          if-no-files-found: warn
          retention-days: 14

  generate-forecast:
    needs: train-and-activate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ML_FORECAST_URL: ${{ secrets.ML_FORECAST_URL }}
      ML_SECRET: ${{ secrets.ML_SECRET }}
    steps:
      - name: Validate forecast secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ML_FORECAST_URL" || { echo "::error::Missing ML_FORECAST_URL"; exit 1; }
          test -n "$ML_SECRET" || { echo "::error::Missing ML_SECRET"; exit 1; }
      - name: Generate seven-day forecasts
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $ML_SECRET" \
              --header "Content-Type: application/json" \
              --data '{"horizon":7}' \
              "$ML_FORECAST_URL/api/ml/forecast"
          )"
          if [[ "$status" != "200" ]]; then
            echo "::error::Forecast endpoint returned HTTP $status"
            python -m json.tool "$response_file" || true
            exit 1
          fi
          python -m json.tool "$response_file"

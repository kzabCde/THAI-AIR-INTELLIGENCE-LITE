name: Apply forecast artifact concurrency patch

on:
  push:
    branches:
      - fix/forecast-concurrent-artifacts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/forecast-concurrent-artifacts
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_forecast_concurrency_patch.py
      - name: Validate syntax
        run: python -m py_compile api/ml/forecast.py tests_py/test_ml_forecast.py
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/forecast-concurrency-patch.yml tools/apply_forecast_concurrency_patch.py
          git add api/ml/forecast.py tests_py/test_ml_forecast.py
          git commit -m 'Optimize forecast artifact loading with concurrency and warm cache'
          git push origin HEAD:fix/forecast-concurrent-artifacts
